    <script>
      (function () {
        try {
          window.addEventListener('error', function (e) {
            if (e && e.message && e.message.indexOf('fetch') !== -1 && e.message.indexOf('getter') !== -1) {
              e.preventDefault();
              e.stopImmediatePropagation();
              return true;
            }
          }, true);

          var proto = window;
          var desc = null;
          while (proto) {
            desc = Object.getOwnPropertyDescriptor(proto, 'fetch');
            if (desc) break;
            proto = Object.getPrototypeOf(proto);
          }
          if (desc && !desc.set && desc.configurable !== false) {
            var currentFetch = window.fetch;
            Object.defineProperty(proto || window, 'fetch', {
              get: function () {
                return currentFetch;
              },
              set: function (fn) {
                currentFetch = fn;
              },
              configurable: true,
              enumerable: true
            });
          }
        } catch (err) {}
      })();
    </script>
